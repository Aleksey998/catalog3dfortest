<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Pogodin_3d</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #121212; color: #f3f4f6; padding: 20px 12px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    h1 { font-size: 22px; color: #4ade80; margin-bottom: 20px; text-align: center; }
    
    .panel-box {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    
    .form-title { 
      font-size: 16px; 
      font-weight: 700; 
      margin-bottom: 14px; 
      color: #fff; 
      border-bottom: 1px solid #333; 
      padding-bottom: 8px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-title-clickable {
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    .form-title-clickable:hover {
      color: #4ade80;
    }
    
    .btn-toggle-arrow {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #9ca3af;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-toggle-arrow:hover { 
      color: #fff; 
      border-color: #4ade80; 
      background: #333;
    }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #9ca3af; }
    
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .input-wrapper input {
      padding-right: 42px !important;
    }
    .input-status-icon {
      position: absolute;
      right: 12px;
      width: 22px;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      border-radius: 50%;
      user-select: none;
      pointer-events: auto;
      cursor: help;
    }
    .input-status-icon.valid {
      display: flex;
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid #4ade80;
      color: #4ade80;
    }
    .input-status-icon.invalid {
      display: flex;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .input-status-icon.checking {
      display: flex;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid #3b82f6;
      color: #60a5fa;
      font-size: 11px;
    }

    input[type="text"], input[type="password"], textarea, select {
      width: 100%; padding: 10px 12px; background: #141414; border: 1px solid #3f3f46;
      border-radius: 6px; color: #fff; font-size: 14px; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #4ade80; }
    textarea { resize: vertical; min-height: 120px; line-height: 1.4; white-space: pre-wrap; }
    
    .row { display: flex; gap: 12px; }
    .col { flex: 1; }
    
    .btn {
      padding: 10px 16px; border: none; border-radius: 6px; font-weight: 700;
      font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-green:hover { background: #15803d; }
    .btn-cancel { background: #3f3f46; color: #fff; display: none; }
    .btn-cancel:hover { background: #52525b; }
    .btn-edit { background: #2563eb; color: #fff; padding: 6px 12px; font-size: 12px; }
    .btn-edit:hover { background: #1d4ed8; }
    .btn-del { background: #dc2626; color: #fff; padding: 6px 12px; font-size: 12px; }
    .btn-del:hover { background: #b91c1c; }

    /* Кнопка отправки формы товара (ПК: компактная) */
    .btn-submit-product {
      width: auto;
      min-width: 180px;
    }

    /* Кнопки порядка разделов */
    .btn-move {
      background: #27272a;
      color: #f3f4f6;
      border: 1px solid #3f3f46;
      padding: 6px 10px;
      font-size: 12px;
      line-height: 1;
    }
    .btn-move:hover:not(:disabled) {
      border-color: #4ade80;
      color: #4ade80;
    }
    .btn-move:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Блок сохранения порядка и новых разделов */
    .order-save-wrap {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .unsaved-badge {
      font-size: 12px;
      color: #f59e0b;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    
    .status-msg { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; text-align: center; }
    .status-msg.success { display: block; background: rgba(74, 222, 128, 0.15); border: 1px solid #4ade80; color: #4ade80; }
    .status-msg.warning { display: block; background: rgba(234, 179, 8, 0.15); border: 1px solid #eab308; color: #facc15; }
    .status-msg.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; }
    .status-msg.loading { display: block; background: rgba(59, 130, 246, 0.15); border: 1px solid #3b82f6; color: #60a5fa; }
    
    /* Интерактивная галерея с Drag & Drop */
    .images-sort-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      min-height: 80px;
      padding: 8px;
      background: #141414;
      border: 1px dashed #3f3f46;
      border-radius: 8px;
    }
    .img-preview-card {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 6px;
      border: 2px solid #3f3f46;
      background: #222;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      transition: transform 0.15s, border-color 0.15s;
    }
    .img-preview-card:active {
      cursor: grabbing;
    }
    .img-preview-card.dragging {
      opacity: 0.4;
      border-color: #4ade80;
      transform: scale(0.95);
    }
    .img-preview-card.drag-over {
      border-color: #4ade80;
      transform: scale(1.05);
    }
    .img-preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .img-badge-main {
      position: absolute;
      bottom: 2px;
      left: 2px;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 4px;
      pointer-events: none;
    }
    .img-remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.2s;
    }
    .img-remove-btn:hover {
      background: #ef4444;
    }

    /* Поиск в админке */
    .admin-search-box { margin-bottom: 14px; }
    .admin-search-input {
      width: 100%;
      padding: 10px 14px;
      background: #141414;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .admin-search-input:focus { border-color: #4ade80; }

    /* ПАГИНАЦИЯ В АДМИНКЕ */
    .pagination-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 14px 0;
      flex-wrap: wrap;
    }
    .page-btn {
      background: #27272a;
      color: #e5e7eb;
      border: 1px solid #3f3f46;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .page-btn:hover:not(:disabled) {
      border-color: #4ade80;
      color: #4ade80;
    }
    .page-btn.active {
      background: #4ade80;
      color: #000;
      border-color: #4ade80;
      cursor: default;
    }
    .page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .page-info {
      font-size: 12px;
      color: #9ca3af;
      margin: 0 4px;
      font-weight: 600;
    }

    /* Списки категорий и товаров */
    .list-group { display: flex; flex-direction: column; gap: 10px; }
    .list-row {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .item-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex-grow: 1;
    }
    .item-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: #222; flex-shrink: 0; }
    .item-info { flex-grow: 1; min-width: 0; }
    .item-name { 
      font-size: 14px; 
      font-weight: 600; 
      color: #fff; 
      line-height: 1.3;
      word-break: break-word;
    }
    .item-meta { font-size: 12px; color: #9ca3af; margin-top: 3px; }
    .item-actions { 
      display: flex; 
      gap: 6px; 
      flex-shrink: 0; 
      align-items: center; 
      flex-wrap: wrap; 
    }

    /* Строка действий формы */
    .submit-actions-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .submit-btn-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Увеличенный чекбокс и 2-строчный текст */
    .tg-publish-label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }
    .tg-publish-label input[type="checkbox"] {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: #2563eb;
      flex-shrink: 0;
    }
    .tg-publish-texts {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .tg-publish-title {
      font-size: 14px;
      font-weight: 700;
      color: #f3f4f6;
      line-height: 1.2;
    }
    .tg-publish-target {
      font-size: 12px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.2;
    }
    .tg-target-badge {
      color: #4ade80;
      font-weight: 700;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .tg-target-warn {
      color: #f59e0b;
      font-size: 11px;
    }
    
    /* Адаптив для мобилок */
    @media (max-width: 600px) {
      .list-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 12px;
      }
      .item-main {
        width: 100%;
      }
      .list-row .item-actions {
        width: 100%;
        justify-content: flex-end;
        gap: 8px;
        border-top: 1px solid #222;
        padding-top: 8px;
      }
      .list-row .item-actions .btn {
        padding: 7px 14px;
        font-size: 12px;
      }
      .row {
        flex-direction: column;
        gap: 8px;
      }
      .submit-actions-row {
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
      }
      .submit-btn-wrap {
        width: 100%;
        flex-direction: column;
      }
      .btn-submit-product {
        width: 100%;
      }
      .tg-publish-label {
        width: 100%;
        padding-top: 6px;
        border-top: 1px dashed #2a2a2a;
      }
    }

    .nav-bottom { text-align: center; margin-top: 20px; }
    .nav-bottom a { color: #9ca3af; text-decoration: none; font-size: 13px; }
    .nav-bottom a:hover { color: #4ade80; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Панель управления Pogodin_3d</h1>

    <div class="panel-box">
      <div class="form-title form-title-clickable" id="authHeaderClickable" title="Нажмите, чтобы свернуть или развернуть">
        <span>🔑 Окно авторизации</span>
        <button type="button" class="btn-toggle-arrow" id="btnToggleAuth">▲</button>
      </div>

      <div id="authContent">
        <div class="form-group">
          <label>Personal Access Token GitHub (classic, права repo):</label>
          <div class="input-wrapper">
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            <span class="input-status-icon" id="status_ghToken" title=""></span>
          </div>
        </div>
        <div class="row">
          <div class="col form-group">
            <label>Логин GitHub (Owner):</label>
            <div class="input-wrapper">
              <input type="text" id="ghOwner" placeholder="Твой ник на GitHub">
              <span class="input-status-icon" id="status_ghOwner" title=""></span>
            </div>
          </div>
          <div class="col form-group">
            <label>Имя репозитория (Repo):</label>
            <div class="input-wrapper">
              <input type="text" id="ghRepo" placeholder="Название репозитория">
              <span class="input-status-icon" id="status_ghRepo" title=""></span>
            </div>
          </div>
        </div>

        <div class="row" style="margin-top: 6px; padding-top: 12px; border-top: 1px dashed #2a2a2a;">
          <div class="col form-group">
            <label>Токен Telegram-бота (из BotFather):</label>
            <div class="input-wrapper">
              <input type="password" id="tgToken" placeholder="123ххххххххххххххххххххххххх">
              <span class="input-status-icon" id="status_tgToken" title=""></span>
            </div>
          </div>
          <div class="col form-group">
            <label>Публичный канал (юзернейм или ID):</label>
            <div class="input-wrapper">
              <input type="text" id="tgChannel" placeholder="@хххххххх">
              <span class="input-status-icon" id="status_tgChannel" title=""></span>
            </div>
          </div>
        </div>

        <button class="btn btn-green" id="btnConnect" style="background:#2563eb; width:100%; margin-top: 6px;">Проверка и сохранение</button>
      </div>
    </div>

    <div class="panel-box" id="catBox" style="display:none;">
      <div class="form-title"><span>🗂️ Управление разделами каталога</span></div>
      <div class="row" style="margin-bottom: 12px;">
        <input type="hidden" id="editCatId">
        <div class="col">
          <input type="text" id="catNameInput" placeholder="Введите название нового раздела.">
        </div>
        <button class="btn btn-green" id="btnSaveCat" style="width: auto; white-space: nowrap;">Добавить в список</button>
        <button class="btn btn-cancel" id="btnCancelCat" style="width: auto;">Отмена</button>
      </div>
      
      <div class="list-group" id="categoriesList"></div>

      <div class="order-save-wrap" id="orderSaveWrap" style="display:none;">
        <div class="unsaved-badge">⚠️ Есть несохраненные изменения в разделах! Нажмите кнопку ниже для отправки в репозиторий.</div>
        <button class="btn btn-green" id="btnSaveCategoriesOrder" style="background: #059669;">💾 Сохранить все изменения разделов на GitHub</button>
      </div>
    </div>

    <div class="panel-box" id="editorBox" style="display:none;">
      <div class="form-title" id="formHeader"><span>➕ Добавить новый товар</span></div>
      
      <form id="productForm">
        <input type="hidden" id="editItemId">

        <div class="row">
          <div class="col form-group">
            <label>Раздел товара:</label>
            <select id="prodCategory" required>
            </select>
          </div>
          <div class="col form-group">
            <label>Цена:</label>
            <input type="text" id="prodPrice" placeholder="например: 1500" required>
          </div>
        </div>

        <div class="form-group">
          <label>Название товара:</label>
          <input type="text" id="prodTitle" placeholder="например: Шестеренка" required>
        </div>

        <div class="form-group">
          <label>Описание и свойства (* - ж, ** - к, _ - п):</label>
          <textarea id="prodDesc" placeholder="Материал: PETG&#10;Особенности: Высокая прочность&#10;Цвет: Черный" required></textarea>
        </div>

        <div class="form-group">
          <label>Фотографии товара (до 6 штук):</label>
          <div class="images-sort-container" id="imagesContainer">
            <div id="noImagesNotice" style="color:#71717a; font-size:13px; margin:auto;">Фотографии не выбраны</div>
          </div>
        </div>

        <div class="form-group">
          <label>Выбрать фото с устройства (автосжатие):</label>
          <input type="file" id="prodFiles" accept="image/*" multiple>
        </div>

        <div class="submit-actions-row">
          <div class="submit-btn-wrap">
            <button type="submit" class="btn btn-green btn-submit-product" id="submitBtn">Выложить товар</button>
            <button type="button" class="btn btn-cancel" id="cancelEditBtn">Отмена</button>
          </div>
          
          <label class="tg-publish-label" id="tgCheckboxContainer">
            <input type="checkbox" id="tgPublishCheck" checked>
            <div class="tg-publish-texts">
              <span class="tg-publish-title">Опубликовать в Telegram</span>
              <span class="tg-publish-target" id="tgPublishTargetDesc">
                <span class="tg-target-warn">Проверка бота и канала...</span>
              </span>
            </div>
          </label>
        </div>
      </form>

      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="panel-box" id="listBox" style="display:none;">
      <div class="form-title"><span>📦 Товары в каталоге (<span id="itemsCount">0</span>)</span></div>
      
      <div class="admin-search-box">
        <input type="text" id="adminSearchInput" class="admin-search-input" placeholder="🔍 Поиск товара по названию.">
      </div>

      <div class="pagination-bar" id="adminPaginationTop" style="display:none;"></div>

      <div class="list-group" id="productsList"></div>

      <div class="pagination-bar" id="adminPaginationBottom" style="display:none;"></div>
    </div>

    <div class="nav-bottom">
      <a href="index.html">← Перейти в каталог</a>
    </div>
  </div>

  <script>
    const tokenInput = document.getElementById('ghToken');
    const ownerInput = document.getElementById('ghOwner');
    const repoInput = document.getElementById('ghRepo');
    const tgTokenInput = document.getElementById('tgToken');
    const tgChannelInput = document.getElementById('tgChannel');
    const btnConnect = document.getElementById('btnConnect');

    const authContent = document.getElementById('authContent');
    const authHeaderClickable = document.getElementById('authHeaderClickable');
    const btnToggleAuth = document.getElementById('btnToggleAuth');

    const catBox = document.getElementById('catBox');
    const editorBox = document.getElementById('editorBox');
    const listBox = document.getElementById('listBox');
    const categoriesList = document.getElementById('categoriesList');
    const catNameInput = document.getElementById('catNameInput');
    const editCatId = document.getElementById('editCatId');
    const btnSaveCat = document.getElementById('btnSaveCat');
    const btnCancelCat = document.getElementById('btnCancelCat');
    const orderSaveWrap = document.getElementById('orderSaveWrap');
    const btnSaveCategoriesOrder = document.getElementById('btnSaveCategoriesOrder');

    const formHeader = document.getElementById('formHeader');
    const productForm = document.getElementById('productForm');
    const editItemId = document.getElementById('editItemId');
    const prodCategory = document.getElementById('prodCategory');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const statusMsg = document.getElementById('statusMsg');

    const tgPublishCheck = document.getElementById('tgPublishCheck');
    const tgPublishTargetDesc = document.getElementById('tgPublishTargetDesc');
    
    const prodFiles = document.getElementById('prodFiles');
    const imagesContainer = document.getElementById('imagesContainer');
    const noImagesNotice = document.getElementById('noImagesNotice');
    const adminSearchInput = document.getElementById('adminSearchInput');
    const productsList = document.getElementById('productsList');
    const itemsCount = document.getElementById('itemsCount');
    const adminPaginationTop = document.getElementById('adminPaginationTop');
    const adminPaginationBottom = document.getElementById('adminPaginationBottom');

    const ADMIN_ITEMS_PER_PAGE = 10;
    let currentAdminPage = 1;

    let allProducts = [];
    let allCategories = [];
    let productsSha = null;
    let categoriesSha = null;
    let hasUnsavedCategoryChanges = false;

    let formImages = [];
    let imagesToDeleteFromGithub = [];

    let verifiedBotUsername = '';
    let verifiedChannelTitle = '';

    // Загрузка сохраненных данных
    tokenInput.value = localStorage.getItem('gh_token') || '';
    ownerInput.value = localStorage.getItem('gh_owner') || '';
    repoInput.value = localStorage.getItem('gh_repo') || '';
    tgTokenInput.value = localStorage.getItem('tg_token') || '';
    tgChannelInput.value = localStorage.getItem('tg_channel') || '';

    // Управление сворачиванием блока авторизации
    function setAuthCollapsed(isCollapsed) {
      if (isCollapsed) {
        authContent.style.display = 'none';
        btnToggleAuth.textContent = '▼';
        localStorage.setItem('auth_collapsed', '1');
      } else {
        authContent.style.display = 'block';
        btnToggleAuth.textContent = '▲';
        localStorage.setItem('auth_collapsed', '0');
      }
    }

    function toggleAuthPanel() {
      const isCurrentlyCollapsed = authContent.style.display === 'none';
      setAuthCollapsed(!isCurrentlyCollapsed);
    }

    authHeaderClickable.addEventListener('click', toggleAuthPanel);
    btnToggleAuth.addEventListener('click', (e) => {

    // Комплексная проверка авторизаций (GitHub + Telegram)
    async function verifyAllCredentials() {
      const ghToken = tokenInput.value.trim();
      const ghOwner = ownerInput.value.trim();
      const ghRepo = repoInput.value.trim();
      const tgToken = tgTokenInput.value.trim();
      const tgChannel = tgChannelInput.value.trim();

      // 1. Проверка GitHub Token
      if (ghToken) {
        setFieldStatus('ghToken', 'checking', 'Проверка токена GitHub...');
        try {
          const userRes = await fetch('https://api.github.com/user', {
            headers: { 'Authorization': `Bearer ${ghToken}` }
          });
          if (userRes.ok) {
            setFieldStatus('ghToken', 'valid', 'Токен GitHub действителен!');
          } else {
            setFieldStatus('ghToken', 'invalid', 'Неверный токен GitHub (401 Unauthorized)');
          }
        } catch {
          setFieldStatus('ghToken', 'invalid', 'Ошибка сети при проверке GitHub токена');
        }
      } else {
        setFieldStatus('ghToken', 'none');
      }

      // 2. Проверка GitHub Репозитория и Owner
      if (ghToken && ghOwner && ghRepo) {
        setFieldStatus('ghOwner', 'checking', 'Проверка доступа...');
        setFieldStatus('ghRepo', 'checking', 'Проверка доступа...');
        try {
          const repoRes = await fetch(`https://api.github.com/repos/${ghOwner}/${ghRepo}`, {
            headers: { 'Authorization': `Bearer ${ghToken}` }
          });
          if (repoRes.ok) {
            setFieldStatus('ghOwner', 'valid', `Владелец ${ghOwner} подтвержден`);
            setFieldStatus('ghRepo', 'valid', `Репозиторий ${ghRepo} доступен с правом записи`);
          } else {
            setFieldStatus('ghOwner', 'invalid', 'Репозиторий или логин не найден');
            setFieldStatus('ghRepo', 'invalid', 'Репозиторий или логин не найден');
          }
        } catch {
          setFieldStatus('ghOwner', 'invalid', 'Ошибка сети');
          setFieldStatus('ghRepo', 'invalid', 'Ошибка сети');
        }
      } else {
        if (!ghOwner) setFieldStatus('ghOwner', 'none');
        if (!ghRepo) setFieldStatus('ghRepo', 'none');
      }

      // 3. Проверка Telegram-бота через getMe
      let isBotValid = false;
      verifiedBotUsername = '';
      if (tgToken) {
        setFieldStatus('tgToken', 'checking', 'Проверка бота...');
        try {
          const meRes = await fetch(`https://api.telegram.org/bot${tgToken}/getMe`);
          const meData = await meRes.json();
          if (meData.ok && meData.result) {
            isBotValid = true;
            verifiedBotUsername = meData.result.username;
            setFieldStatus('tgToken', 'valid', `Бот @${verifiedBotUsername} авторизован`);
          } else {
            setFieldStatus('tgToken', 'invalid', 'Неверный токен Telegram-бота');
          }
        } catch {
          setFieldStatus('tgToken', 'invalid', 'Ошибка соединения с Telegram API');
        }
      } else {
        setFieldStatus('tgToken', 'none');
      }

      // 4. Проверка Telegram-канала через getChat
      let isChannelValid = false;
      verifiedChannelTitle = '';
      if (tgToken && isBotValid && tgChannel) {
        setFieldStatus('tgChannel', 'checking', 'Проверка канала...');
        try {
          const chatRes = await fetch(`https://api.telegram.org/bot${tgToken}/getChat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: tgChannel })
          });
          const chatData = await chatRes.json();
          if (chatData.ok && chatData.result) {
            isChannelValid = true;
            verifiedChannelTitle = chatData.result.title || tgChannel;
            setFieldStatus('tgChannel', 'valid', `Канал: "${verifiedChannelTitle}" найден`);
          } else {
            setFieldStatus('tgChannel', 'invalid', 'Канал не найден или бот не добавлен админом');
          }
        } catch {
          setFieldStatus('tgChannel', 'invalid', 'Ошибка связи с каналом');
        }
      } else {
        if (!tgChannel) setFieldStatus('tgChannel', 'none');
      }

      // Обновление строки под чекбоксом Telegram
      updateTelegramTargetLabel(isBotValid, isChannelValid, tgChannel);
    }

    // Функция авто-ресайза и сжатия
    function compressImageFile(file, maxWidth = 1400, quality = 0.82) {
      return new Promise((resolve) => {
        if (!file.type.match(/image.*/) || file.type === 'image/gif' || file.type === 'image/svg+xml') {
          const reader = new FileReader();
          reader.onload = () => resolve({ base64: reader.result.split(',')[1], ext: file.name.split('.').pop() || 'jpg' });
          reader.readAsDataURL(file);
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64 = dataUrl.split(',')[1];
            resolve({ base64: base64, ext: 'jpg' });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function slugify(text) {
      const ru = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"," ":"_"};
      return text.toLowerCase().split('').map(char => ru[char] || char).join('').replace(/[^a-z0-9_]/g, '');
    }

    function renderImagesSortList() {
      imagesContainer.innerHTML = '';

      formImages.forEach((imgObj, index) => {
        const card = document.createElement('div');

        card.draggable = true;
        card.dataset.index = index;

        card.innerHTML = `

        `;

        card.addEventListener('dragover', handleDragOver);

        card.addEventListener('drop', handleDrop);
        card.addEventListener('dragend', handleDragEnd);

        imagesContainer.appendChild(card);
      });

    let draggedItemIndex = null;

    function handleDragStart(e) {
      draggedItemIndex = parseInt(this.dataset.index);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      this.classList.add('drag-over');
    }

    function handleDragLeave() {
      this.classList.remove('drag-over');
    }

    function handleDrop(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      const targetIndex = parseInt(this.dataset.index);
      if (draggedItemIndex === null || draggedItemIndex === targetIndex) return;

      const [movedItem] = formImages.splice(draggedItemIndex, 1);
      formImages.splice(targetIndex, 0, movedItem);
      renderImagesSortList();
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
      document.querySelectorAll('.img-preview-card').forEach(el => el.classList.remove('drag-over'));
    }

    window.removeImageFromForm = function(index) {

    async function deleteImageFromGithub(filePath) {
      if (!filePath.startsWith('images/')) return;
      const token = tokenInput.value.trim();
      const owner = ownerInput.value.trim();
      const repo = repoInput.value.trim();

      try {
        const getFileRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!getFileRes.ok) return;
        const fileData = await getFileRes.json();

        await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `Удален файл изображения: ${filePath}`,
            sha: fileData.sha
          })
        });
      } catch (err) {
        console.warn(`Не удалось удалить файл ${filePath}:`, err);
      }
    }

    async function saveCategoriesToGithub(message) {
      const token = tokenInput.value.trim();
      const owner = ownerInput.value.trim();
      const repo = repoInput.value.trim();

      // Запрашиваем свежий SHA файла перед отправкой
      const freshRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/categories.json?ref=main&t=${Date.now()}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (freshRes.ok) {
        const freshData = await freshRes.json();
        categoriesSha = freshData.sha;
      }

      const content = btoa(unescape(encodeURIComponent(JSON.stringify(allCategories, null, 2))));

      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/categories.json`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, content: content, sha: categoriesSha })
      });

      if (!res.ok) throw new Error(`Ошибка сохранения категорий: ${res.statusText}`);
      const data = await res.json();
      categoriesSha = data.content.sha;
    }

    function renderAdminPagination(totalItems) {
      const totalPages = Math.ceil(totalItems / ADMIN_ITEMS_PER_PAGE);

      if (totalPages <= 1) {
        adminPaginationTop.style.display = 'none';
        adminPaginationBottom.style.display = 'none';
        adminPaginationTop.innerHTML = '';
        adminPaginationBottom.innerHTML = '';
        return;
      }

      if (currentAdminPage > totalPages) currentAdminPage = totalPages;
      if (currentAdminPage < 1) currentAdminPage = 1;

      let html = '';
      html += `<button class="page-btn" ${currentAdminPage === 1 ? 'disabled' : ''} onclick="goToAdminPage(${currentAdminPage - 1})">← Назад</button>`;

      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 7) {
          if (i !== 1 && i !== totalPages && Math.abs(i - currentAdminPage) > 1) {
            if (i === 2 || i === totalPages - 1) {
              html += `<span class="page-info">...</span>`;
            }
            continue;
          }
        }
        html += `<button class="page-btn ${i === currentAdminPage ? 'active' : ''}" onclick="goToAdminPage(${i})">${i}</button>`;
      }

      html += `<button class="page-btn" ${currentAdminPage === totalPages ? 'disabled' : ''} onclick="goToAdminPage(${currentAdminPage + 1})">Вперед →</button>`;
      html += `<span class="page-info">Стр. ${currentAdminPage} из ${totalPages}</span>`;

      adminPaginationTop.innerHTML = html;
      adminPaginationBottom.innerHTML = html;
      adminPaginationTop.style.display = 'flex';
      adminPaginationBottom.style.display = 'flex';
    }

    window.goToAdminPage = function(page) {
      currentAdminPage = page;
      renderProductsList();
      window.scrollTo({ top: listBox.offsetTop - 20, behavior: 'smooth' });
    };

    function renderProductsList() {
      const query = adminSearchInput.value.trim().toLowerCase();
      
      const filtered = query 
        ? allProducts.filter(p => p.title.toLowerCase().includes(query))
        : allProducts;

      itemsCount.textContent = query 
        ? `${filtered.length} из ${allProducts.length}` 
        : allProducts.length;

      renderAdminPagination(filtered.length);
      productsList.innerHTML = '';

      if (filtered.length === 0) {
        productsList.innerHTML = '<div style="color:#71717a; text-align:center; padding:12px;">Ничего не найдено</div>';
        return;
      }

      const startIndex = (currentAdminPage - 1) * ADMIN_ITEMS_PER_PAGE;
      const pageItems = filtered.slice(startIndex, startIndex + ADMIN_ITEMS_PER_PAGE);

      pageItems.forEach(item => {
        const catObj = allCategories.find(c => c.id === item.category);
        const catLabel = catObj ? catObj.name : item.category;
        const img = item.images && item.images.length > 0 ? item.images[0] : 'nofoto.jpg';

        const row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML = `
          <div class="item-main">
            <img src="${img}" class="item-thumb" onerror="this.src='nofoto.jpg'">
            <div class="item-info">
              <div class="item-name">${item.title}</div>
              <div class="item-meta">${item.price} • ${catLabel}</div>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn btn-edit" onclick="startEdit(${item.id})">Редактировать</button>
            <button class="btn btn-del" onclick="deleteItem(${item.id})">Удалить</button>
          </div>
        `;
        productsList.appendChild(row);
      });
    }

    window.startEdit = function(id) {
      const item = allProducts.find(p => p.id === id);
      if (!item) return;

      editItemId.value = item.id;
      prodCategory.value = item.category;
      document.getElementById('prodPrice').value = item.price;
      document.getElementById('prodTitle').value = item.title;
      document.getElementById('prodDesc').value = item.desc;

      formImages = (item.images || []).map((src, idx) => ({
        id: 'exist_' + idx + '_' + Date.now(),
        type: 'existing',
        src: src
      }));
      imagesToDeleteFromGithub = [];

      renderImagesSortList();

      formHeader.querySelector('span').textContent = `✏️ Редактирование: ${item.title}`;
      submitBtn.textContent = 'Сохранить изменения';
      cancelEditBtn.style.display = 'inline-block';
      
      tgPublishCheck.checked = false;

      window.scrollTo({ top: editorBox.offsetTop - 20, behavior: 'smooth' });
    };

    cancelEditBtn.addEventListener('click', resetForm);

    function resetForm() {
      editItemId.value = '';
      productForm.reset();
      formImages = [];
      imagesToDeleteFromGithub = [];
      renderImagesSortList();
      formHeader.querySelector('span').textContent = '➕ Добавить новый товар';
      submitBtn.textContent = 'Выложить товар';
      cancelEditBtn.style.display = 'none';
      tgPublishCheck.checked = true;
    }

    // Сохранение товара (пакетный коммит через Git Data API)
    productForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = tokenInput.value.trim();
      const owner = ownerInput.value.trim();
      const repo = repoInput.value.trim();

      const tgToken = tgTokenInput.value.trim();
      const tgChannel = tgChannelInput.value.trim();
      const shouldPublishToTg = tgPublishCheck.checked && tgToken && tgChannel;

      submitBtn.disabled = true;
      showStatus('loading', '⏳ Подготовка файлов к отправке...');

      try {
        // Запрашиваем СВЕЖИЙ хэш ветки main
        const branchRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/branches/main?t=${Date.now()}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!branchRes.ok) throw new Error('Не удалось получить данные ветки main');
        const branchData = await branchRes.json();
        const baseCommitSha = branchData.commit.sha;
        const baseTreeSha = branchData.commit.commit.tree.sha;

        // Запрашиваем актуальный products.json
        const freshProdRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/products.json?ref=main&t=${Date.now()}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (freshProdRes.ok) {
          const freshProdData = await freshProdRes.json();
          productsSha = freshProdData.sha;
          allProducts = JSON.parse(decodeURIComponent(escape(atob(freshProdData.content.replace(/\s/g, '')))));
        }

        const treeItems = [];

        // Удаление старых фото
        if (imagesToDeleteFromGithub.length > 0) {
          for (const imgPath of imagesToDeleteFromGithub) {
            treeItems.push({
              path: imgPath,
              mode: '100644',
              type: 'blob',
              sha: null
            });
          }
        }

        let finalImages = [];
        const timestamp = Date.now();

        // Заливка фото
        for (let i = 0; i < formImages.length; i++) {
          const item = formImages[i];
          if (item.type === 'existing') {
            finalImages.push(item.src);
          } else if (item.type === 'new' && item.file) {
            showStatus('loading', `⏳ Сжатие и заливка blob фото ${i + 1} из ${formImages.length}...`);
            
            const { base64, ext } = await compressImageFile(item.file, 1400, 0.82);
            const filePath = `images/prod_${timestamp}_${i + 1}.${ext}`;

            const blobRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/blobs`, {
              method: 'POST',
              headers: { 
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                content: base64,
                encoding: 'base64'
              })
            });

            if (!blobRes.ok) throw new Error(`Ошибка загрузки blob: ${blobRes.statusText}`);
            const blobData = await blobRes.json();

            treeItems.push({
              path: filePath,
              mode: '100644',
              type: 'blob',
              sha: blobData.sha
            });

            finalImages.push(filePath);
          }
        }

        finalImages = finalImages.slice(0, 6);
        if (finalImages.length === 0) finalImages = ['nofoto.jpg'];

        const isEdit = Boolean(editItemId.value);
        const idToUpdate = isEdit ? parseInt(editItemId.value) : Date.now();

        const updatedItem = {
          id: idToUpdate,
          category: prodCategory.value,
          title: document.getElementById('prodTitle').value.trim(),
          desc: document.getElementById('prodDesc').value.trim(),
          price: document.getElementById('prodPrice').value.trim(),
          images: finalImages
        };

        if (isEdit) {
          const index = allProducts.findIndex(p => p.id === idToUpdate);
          if (index !== -1) allProducts[index] = updatedItem;
        } else {
          allProducts.unshift(updatedItem);
        }

        treeItems.push({
          path: 'products.json',
          mode: '100644',
          type: 'blob',
          content: JSON.stringify(allProducts, null, 2)
        });

        showStatus('loading', '⏳ Создание единого коммита...');

        const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base_tree: baseTreeSha,
            tree: treeItems
          })
        });
        if (!treeRes.ok) throw new Error(`Ошибка создания tree: ${treeRes.statusText}`);
        const treeData = await treeRes.json();

        const commitMessage = isEdit ? `Обновлен товар: ${updatedItem.title}` : `Добавлен товар: ${updatedItem.title}`;
        const commitRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/commits`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: commitMessage,
            tree: treeData.sha,
            parents: [baseCommitSha]
          })
        });
        if (!commitRes.ok) throw new Error(`Ошибка создания коммита: ${commitRes.statusText}`);
        const commitData = await commitRes.json();

        const updateRefRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs/heads/main`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sha: commitData.sha,
            force: false
          })
        });
        if (!updateRefRes.ok) throw new Error(`Ошибка обновления ветки: ${updateRefRes.statusText}`);

        // 4. Отправка в Telegram-канал
        let tgSentSuccess = true;
        let tgErrorMessage = '';

        if (shouldPublishToTg && !isEdit) {
          showStatus('loading', '⏳ Публикация новинки в Telegram-канал...');
          try {
            const firstImg = (finalImages && finalImages.length > 0) ? finalImages[0] : '';
            const isRealPhoto = firstImg && !firstImg.includes('placeholder.com') && !firstImg.startsWith('data:') && firstImg !== 'nofoto.jpg';

            let photoUrl = '';
            if (isRealPhoto) {
              photoUrl = firstImg.startsWith('images/')
                ? `https://raw.githubusercontent.com/${owner}/${repo}/main/${firstImg}`
                : firstImg;
            } else {
              photoUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/nofoto.jpg`;
            }

            const botUsername = verifiedBotUsername || 'pogodin_3d_bot';
            const miniAppName = 'catalogp3d'; 
            const miniAppUrl = `https://t.me/${botUsername}/${miniAppName}?startapp=item_${updatedItem.id}`;
            
            const rawPrice = String(updatedItem.price).replace(/[^\d\s.,]/g, '').trim();
            const orderMsg = `Здравствуйте! Хочу сделать заказ в Pogodin_3d: "${item.title}" по цене ${cleanPrice} ₽. Подскажите пожалуйста по срокам изготовления.`;
            const botOrderUrl = `https://t.me/${botUsername}?text=${encodeURIComponent(orderMsg)}`;
            
            const browserCatalogUrl = `https://${owner}.github.io/${repo}/index.html?item=${updatedItem.id}`;

            // Экранирование спецсимволов HTML
            const escapeHtml = (str) => String(str || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');

            // Всеядный парсер с балансировщиком тегов
            function parseCustomMarkdown(text) {
              if (!text) return '';
              let s = escapeHtml(text);

              // 1. Строго от сложных комбинаций к простым (порядок знаков равнозначен!)
              s = s.replace(/\*\*\*_(.*?)_?\*\*\*/g, '<b><i><u>$1</u></i></b>');
              s = s.replace(/(\*\*_|_\*\*)(.*?)(_\*\*|\*\*_)/g, '<i><u>$2</u></i>');
              s = s.replace(/(\*_|_\*)(.*?)(_\*|\*_)/g, '<b><u>$2</u></b>');
              s = s.replace(/\*\*(.*?)\*\*/g, '<i>$1</i>');
              s = s.replace(/\*(.*?)\*/g, '<b>$1</b>');
              s = s.replace(/_(.*?)_/g, '<u>$1</u>');

              // 2. Автозакрытие повисших тегов
              const openStack = [];
              const tagRegex = /<\/?([biu])>/g;
              let match;
              while ((match = tagRegex.exec(s)) !== null) {
                const fullTag = match[0];
                const tagName = match[1];
                if (!fullTag.startsWith('</')) {
                  openStack.push(tagName);
                } else {
                  if (openStack.length > 0 && openStack[openStack.length - 1] === tagName) {
                    openStack.pop();
                  }
                }
              }

              while (openStack.length > 0) {
                s += `</${openStack.pop()}>`;
              }

              return s;
            }

            // Обрезка текста до 150 символов
            let rawDesc = (updatedItem.desc || '');
            let isLong = rawDesc.length > 150;
            let targetText = rawDesc;

            if (isLong) {
              let cut = rawDesc.slice(0, 150);
              if ((cut.match(/\*\*\*/g) || []).length % 2 !== 0) cut += '***';
              else if ((cut.match(/\*\*/g) || []).length % 2 !== 0) cut += '**';
              else if ((cut.match(/\*/g) || []).length % 2 !== 0) cut += '*';
              if ((cut.match(/_/g) || []).length % 2 !== 0) cut += '_';
              targetText = cut + '...';
            }

            let formattedDesc = parseCustomMarkdown(targetText);

            const safeTitle = escapeHtml(updatedItem.title);
            const safePrice = escapeHtml(updatedItem.price);

            const caption = 
              `🔥 <i>Новинка в каталоге Pogodin_3d!</i>\n\n` +
              `📦 <b>${safeTitle}</b>\n` +
              `💰 <b><u>Цена:</u></b> <b>${safePrice}</b>\n\n` +
              `${formattedDesc}\n\n` +
              `⬇️ <i>Заказывайте прямо сейчас</i> ⬇️`;

            const tgRes = await fetch(`https://api.telegram.org/bot${tgToken}/sendPhoto`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: tgChannel,
                photo: photoUrl,
                caption: caption,
                parse_mode: 'HTML',
                reply_markup: {
                  inline_keyboard: [
                    [ { text: '💬 Написать мастеру', url: botOrderUrl } ],
                    [ { text: '📱 Открыть в приложении', url: miniAppUrl } ],
                    [ { text: '🌐 Открыть в каталоге', url: browserCatalogUrl } ]
                  ]
                }
              })
            });

            const tgData = await tgRes.json();
            if (!tgData.ok) {
              tgSentSuccess = false;
              tgErrorMessage = tgData.description || 'Не удалось отправить фото';
              console.warn('Ошибка Telegram:', tgData);
            }
          } catch (tgErr) {
            tgSentSuccess = false;
            tgErrorMessage = tgErr.message;
            console.warn('Ошибка сети Telegram:', tgErr);
          }
        }

        // ========================================================
        // ИТОГОВЫЙ СТАТУС ДЛЯ ПОЛЬЗОВАТЕЛЯ
        // ========================================================
        if (shouldPublishToTg && !isEdit && !tgSentSuccess) {
          // ЖЕЛТЫЙ СТАТУС: товар в каталоге сохранился, но Telegram отклонил пост
          showStatus('warning', `⚠️ Товар сохранён в каталоге, но в Telegram не ушёл: ${tgErrorMessage}`);
        } else {
          // ЗЕЛЕНЫЙ СТАТУС: всё выполнено безупречно
          showStatus('success', isEdit ? '✅ Изменения товара сохранены на GitHub!' : '✅ Товар успешно сохранён и опубликован в Telegram!');
        }

        resetForm();
        renderProductsList();
      } catch (err) {
        showStatus('error', `❌ Ошибка: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
      }
    });

    window.deleteItem = async function(id) {
      const item = allProducts.find(p => p.id === id);
      if (!confirm(`Точно удалить товар "${item.title}" и все его фото из папки images/?`)) return;

      showStatus('loading', '⏳ Удаление фото и товара с GitHub...');
      try {
        if (item.images && item.images.length > 0) {
          for (const imgPath of item.images) {
            await deleteImageFromGithub(imgPath);
          }
        }

        allProducts = allProducts.filter(p => p.id !== id);
        await saveProductsToGithub(`Удален товар: ${item.title}`);
        showStatus('success', `🗑️ Товар "${item.title}" и его фото удалены.`);
        renderProductsList();
        if (editItemId.value == id) resetForm();
      } catch (err) {
        showStatus('error', `❌ Ошибка удаления: ${err.message}`);
      }
    };

    async function saveProductsToGithub(message) {
      const token = tokenInput.value.trim();
      const owner = ownerInput.value.trim();
      const repo = repoInput.value.trim();

      // Запрашиваем свежий SHA файла перед отправкой
      const freshRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/products.json?ref=main&t=${Date.now()}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (freshRes.ok) {
        const freshData = await freshRes.json();
        productsSha = freshData.sha;
      }

      const content = btoa(unescape(encodeURIComponent(JSON.stringify(allProducts, null, 2))));

      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/products.json`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, content: content, sha: productsSha })
      });

      if (!res.ok) throw new Error(`Ошибка сохранения товаров: ${res.statusText}`);
      const data = await res.json();
      productsSha = data.content.sha;
    }

    function showStatus(type, msg) {
      if (window.statusAutoClearTimer) {
        clearTimeout(window.statusAutoClearTimer);
      }
      statusMsg.className = `status-msg ${type}`;
      statusMsg.textContent = msg;
      statusMsg.style.display = 'block';

      // Автоскрытие для success (5 сек) и warning (8 сек)
      if (type === 'success' || type === 'warning') {
        window.statusAutoClearTimer = setTimeout(() => {
          hideStatus();
        }, type === 'warning' ? 8000 : 5000);
      }
    }

    function hideStatus() {
      statusMsg.className = 'status-msg';
      statusMsg.style.display = 'none';
      statusMsg.textContent = '';
    }
  </script>
</body>
</html>
